# Cucumber E2E Test Profile Configuration
# Only contains test-specific overrides - inherits all other settings from application.yml
#
# NOTE: This profile is for E2E testing with a live Cyoda instance.
# Credentials are loaded from environment variables (CYODA_HOST, CYODA_CLIENT_ID, CYODA_CLIENT_SECRET)
# or from .env file. Default values below are for local testing with Cyoda running on localhost:8443.
#
# To run Cucumber tests:
#   1. Ensure a Cyoda instance is running
#   2. Set environment variables or copy .env file:
#      export CYODA_HOST=localhost:8443
#      export CYODA_CLIENT_ID=your-m2m-client-id
#      export CYODA_CLIENT_SECRET=your-m2m-client-secret
#   3. Run: ./gradlew :apps:backend:cucumberTest

app:
  users:
    - username: ${APP_USERS_0_USERNAME:admin}
      password: ${APP_USERS_0_PASSWORD:admin123}
      role: ${APP_USERS_0_ROLE:ADMIN}
    - username: ${APP_USERS_1_USERNAME:tester}
      password: ${APP_USERS_1_PASSWORD:tester123}
      role: ${APP_USERS_1_ROLE:TESTER}
  cors:
    # Cucumber test CORS settings - allow multiple local ports for testing
    allowed-origins: http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:3000,http://localhost:5173

  config:
    # Cyoda Platform Connection - Cucumber Test Configuration
    # These values are loaded from environment variables or .env file
    # Default: localhost:8443 (for local Cyoda development)
    cyoda-host: ${CYODA_HOST:localhost:8443}
    cyoda-api-url: https://${app.config.cyoda-host}/api
    # M2M credentials - MUST be set via environment variables or .env file
    # DO NOT commit real credentials to the repository
    cyoda-client-id: ${CYODA_CLIENT_ID:}
    cyoda-client-secret: ${CYODA_CLIENT_SECRET:}

    # gRPC Configuration - Cucumber Tests
    grpc-address: ${CYODA_HOST:localhost:8443}
    grpc-server-port: 443
    grpc-processor-tag: cucumber-java-test

    # gRPC Channel Configuration - Increased for large test operations
    grpc-max-inbound-message-size: 33554432  # 32MB for very large operations
    grpc-keep-alive-time-seconds: 15  # More frequent keep-alive for tests

    # SSL Configuration for development with self-signed certificates
    # WARNING: Only use in development/testing - NOT for production
    ssl-trust-all: true
    ssl-trusted-hosts: localhost:8443,localhost:443