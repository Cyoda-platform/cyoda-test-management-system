logging:
  level:
    root: INFO

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      resolve-lazily: false

app:
  seeder:
    enabled: false
  auth:
    secret: test-signing-secret-32-chars-ok!!
  config:
    # Unit test configuration - uses mocked Cyoda server
    # These are dummy values for testing, NOT real credentials
    cyoda-host: ${CYODA_HOST:localhost}
    cyoda-api-url: http://localhost:8080/api
    cyoda-client-id: ${CYODA_CLIENT_ID:test-unit-client}
    cyoda-client-secret: ${CYODA_CLIENT_SECRET:test-unit-secret}
    grpc-address: localhost
    grpc-server-port: 50051

